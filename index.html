<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nadeer PC | Portfolio</title>

    <style>
        :root {
            --bg: #0b0f0e;
            --header: #121917;
            --card: #18221e;
            --text: #ffffff;
            --muted: #a3b3ad;
            --accent: #00d26a; /* Professional Emerald Green */
            --shadow: rgba(0, 210, 106, 0.15);
        }

        body.light {
            --bg: #f4f8f6;
            --header: #ffffff;
            --card: #ffffff;
            --text: #111c18;
            --muted: #566861;
            --accent: #008f45; /* Deep Executive Emerald */
            --shadow: rgba(0, 143, 69, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--text);
            transition: 0.4s;
        }

        /* HEADER */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 8%;
            background: var(--header);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 3px 15px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 25px;
            color: var(--accent);
            font-weight: bold;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        nav a {
            color: var(--text);
            text-decoration: none;
            transition: 0.3s;
            font-size: 15px;
        }

        nav a:hover {
            color: var(--accent);
        }

        #themeBtn {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 10px 17px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        #themeBtn:hover {
            transform: scale(1.05);
        }

        /* HERO */

        .hero {
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            background:
                radial-gradient(circle at top, rgba(0, 210, 106, 0.12), transparent 65%);
        }

        .hero h1 {
            font-size: clamp(35px, 6vw, 65px);
            margin-bottom: 20px;
            animation: fadeIn 1.2s ease;
        }

        .hero h1 span {
            color: var(--accent);
        }

        .hero p {
            color: var(--muted);
            font-size: 19px;
            margin-bottom: 30px;
            animation: fadeIn 1.8s ease;
        }

        .btn {
            display: inline-block;
            background: var(--accent);
            color: #ffffff;
            padding: 14px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px var(--shadow);
        }

        /* SECTIONS */

        section {
            padding: 80px 8%;
            text-align: center;
        }

        section h2 {
            font-size: 35px;
            margin-bottom: 35px;
            color: var(--accent);
        }

        /* ABOUT */

        .about p {
            max-width: 750px;
            margin: auto;
            line-height: 1.9;
            color: var(--muted);
            font-size: 17px;
        }

        /* SKILLS */

        .skills {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .skill {
            background: var(--card);
            padding: 25px 40px;
            border-radius: 15px;
            border: 1px solid var(--accent);
            transition: 0.3s;
            font-weight: bold;
        }

        .skill:hover {
            transform: translateY(-8px);
            box-shadow: 0 5px 20px var(--shadow);
        }

        /* EXPERIENCE */

        .experience-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
        }

        .experience-card {
            background: var(--card);
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            border: 1px solid var(--accent);
            transition: 0.3s;
            text-align: left;
        }

        .experience-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 5px 20px var(--shadow);
        }

        .experience-card h3 {
            color: var(--accent);
            margin-bottom: 10px;
        }

        .experience-card h4 {
            color: var(--text);
            margin-bottom: 15px;
            font-size: 16px;
        }

        .experience-card p {
            color: var(--muted);
            line-height: 1.7;
        }

        /* PROJECTS */

        .projects {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
        }

        .project {
            background: var(--card);
            border-radius: 15px;
            padding: 30px;
            width: 280px;
            border: 1px solid var(--accent);
            transition: 0.3s;
        }

        .project:hover {
            transform: translateY(-8px);
            box-shadow: 0 5px 20px var(--shadow);
        }

        .project h3 {
            color: var(--accent);
            margin-bottom: 15px;
        }

        .project p {
            color: var(--muted);
            line-height: 1.7;
        }

        /* CONTACT */

        .contact p {
            margin: 18px;
            color: var(--muted);
        }

        /* FOOTER */

        footer {
            text-align: center;
            padding: 25px;
